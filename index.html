<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Balloon Tactical Command v14</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0a0b10; --panel: rgba(25, 30, 40, 0.95);
            --accent: #00e676; --danger: #ff5252; --text: #f0f0f0; 
            --glass: rgba(255, 255, 255, 0.08); --predict: #4fc3f7; --traj: #ff9800;
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #map { flex-grow: 1; width: 100%; z-index: 1; background: #111; }

        /* Panels */
        .side-panel { position: absolute; top: 0; left: 0; width: 350px; height: 100%; background: var(--panel); z-index: 5000; transform: translateX(-110%); transition: transform 0.3s ease; padding: 25px; box-sizing: border-box; border-right: 1px solid var(--glass); overflow-y: auto; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        .side-panel.open { transform: translateX(0); }
        .section { background: var(--glass); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--glass); }
        .section-title { font-size: 0.75rem; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid var(--glass); padding-bottom: 5px; }

        /* Dashboard */
        #dashboard { height: 180px; background: var(--panel); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; z-index: 1000; border-top: 1px solid var(--glass); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .data-box { background: var(--glass); border-radius: 12px; padding: 8px; text-align: center; border: 1px solid var(--glass); display: flex; flex-direction: column; justify-content: center; }
        .label { font-size: 0.6rem; color: #888; text-transform: uppercase; }
        .value { font-size: 1.2rem; font-weight: bold; font-family: 'Courier New', monospace; }

        /* UI Elements */
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.9rem; transition: 0.2s; margin-top: 5px; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-alt { background: #5c6bc0; color: white; }
        input, select { background: #000; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; margin-bottom: 10px; font-size: 1rem; }

        .fab-container { position: absolute; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 12px; }
        .fab { width: 55px; height: 55px; background: var(--panel); border: 1px solid var(--glass); border-radius: 18px; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; backdrop-filter: blur(10px); }

        /* Simulation Controls */
        #sim-ui { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); z-index: 3000; display: none; gap: 30px; }
        .sim-ctrl { width: 85px; height: 85px; border-radius: 50%; border: 3px solid white; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.7rem; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Alerts */
        #drop-alert { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); background: var(--danger); padding: 30px; border-radius: 20px; font-weight: bold; font-size: 2.5rem; display: none; z-index: 4000; border: 5px solid white; box-shadow: 0 0 50px rgba(255,0,0,0.8); }
    </style>
</head>
<body>

<div id="audio-init" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <h1 style="color:var(--accent); letter-spacing:5px;">TACTICAL COMMAND</h1>
    <button onclick="initApp()" class="btn" style="width:280px; padding:25px; font-size:1.5rem; border-radius:50px;">INITIALISIEREN</button>
</div>

<div id="drop-alert">DROP JETZT!</div>

<!-- Simulation Interface -->
<div id="sim-ui">
    <div id="sim-vent" class="sim-ctrl" style="background:#1976d2;" onmousedown="simInput('vent',true)" onmouseup="simInput('vent',false)" ontouchstart="simInput('vent',true)" ontouchend="simInput('vent',false)">VENTIL<br>SINKEN</div>
    <div id="sim-burn" class="sim-ctrl" style="background:#d32f2f;" onmousedown="simInput('burn',true)" onmouseup="simInput('burn',false)" ontouchstart="simInput('burn',true)" ontouchend="simInput('burn',false)">BRENNER<br>STEIGEN</div>
</div>

<!-- Sidebar: Mission & Tasks -->
<div id="mission-panel" class="side-panel">
    <h2>Mission Control</h2>
    <div class="section">
        <div class="section-title">Wettkampf-Aufgabe</div>
        <select id="task-type" onchange="updateTaskSettings()">
            <option value="JDG">JDG - Judge Declared Goal</option>
            <option value="PDG">PDG - Pilot Declared (3D)</option>
            <option value="HWZ">HWZ - Hesitation Waltz</option>
            <option value="DONUT">MDT - Donut (Max Distance)</option>
        </select>
        <div id="task-params">
            <input type="number" id="target-alt" placeholder="Zielhöhe AMSL (m)" value="400">
        </div>
    </div>
    <div class="section">
        <div class="section-title">Winddaten (Windwatch.dat)</div>
        <input type="file" id="wind-file" accept=".dat" style="display:none" onchange="processWindwatch(this)">
        <button class="btn btn-alt" onclick="document.getElementById('wind-file').click()">Datei laden</button>
        <div id="wind-info" style="font-size:0.7rem; margin-top:5px; color:#aaa;">Keine Daten.</div>
    </div>
    <div class="section">
        <div class="section-title">UTM 4x4 Schnelleingabe</div>
        <div style="display:flex; gap:5px;">
            <input type="number" id="utm-e" placeholder="E 4x">
            <input type="number" id="utm-n" placeholder="N 4x">
        </div>
        <button class="btn" onclick="setTargetByUTM()">UTM Ziel setzen</button>
    </div>
    <div class="section">
        <div class="section-title">Modus</div>
        <button id="sim-toggle" class="btn" style="background:#fbc02d; color:#000;" onclick="toggleSimulator()">SIMULATOR: OFF</button>
        <button class="btn btn-alt" style="margin-top:10px;" onclick="exportGPX()">GPX Export</button>
    </div>
    <button class="btn btn-alt" onclick="togglePanel('mission-panel')">Schließen</button>
</div>

<!-- Main UI -->
<div class="fab-container">
    <div class="fab" onclick="togglePanel('mission-panel')">📋</div>
    <div class="fab" style="background:var(--danger)" onclick="logMarker()">🎯</div>
    <div class="fab" onclick="centerMap()">📍</div>
</div>

<div id="map"></div>

<div id="dashboard">
    <div class="data-box"><div class="label">HÖHE (m)</div><div id="val-alt" class="value">0</div></div>
    <div class="data-box"><div class="label">SPD (k/h)</div><div id="val-spd" class="value">0.0</div></div>
    <div class="data-box"><div class="label">KURS</div><div id="val-hdg" class="value">0°</div></div>
    <div class="data-box" style="border-color:var(--predict)"><div class="label">5MIN POS</div><div id="val-5min" class="value">---</div></div>
    
    <div class="data-box" style="grid-column: span 2; border-bottom:3px solid var(--accent);"><div class="label" id="res-label">Ziel Distanz</div><div id="val-res" class="value">---</div></div>
    <div class="data-box" style="grid-column: span 2; border-bottom:3px solid var(--danger);"><div class="label">Marker Drop Dist</div><div id="val-drop" class="value">---</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // --- STATE ---
    let windProfile = {}; let track = []; let markers = [];
    let current = { lat: 51.1, lon: 10.4, alt: 801, spd: 0, hdg: 0, vs: 0 };
    let target = null; let groundM = 801; //
    let sim = { active: false, burn: false, vent: false };
    let wakeLock = null; let audio = null;

    // --- MAP ---
    const map = L.map('map', { zoomControl: false, tap: false }).setView([51.1, 10.4], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    const bMark = L.circleMarker([0,0], { radius: 10, color: '#00e676', fillOpacity: 1 }).addTo(map);
    const dMark = L.circleMarker([0,0], { radius: 6, color: '#ff5252' }).addTo(map);
    const tLine = L.polyline([], { color: '#00e676', weight: 2, opacity: 0.4 }).addTo(map);
    const pLine = L.polyline([], { color: '#4fc3f7', weight: 3, dashArray: '10,10' }).addTo(map);

    // --- INIT ---
    async function initApp() {
        document.getElementById('audio-init').style.display = 'none';
        audio = new (window.AudioContext || window.webkitAudioContext)();
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        
        startGPS();
        setInterval(mainLoop, 100); // 10Hz Engine
    }

    // --- WINDWATCH PARSER ---
    function processWindwatch(input) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            let gFt = 2627.95; // Default aus Datei
            let count = 0;
            lines.forEach(line => {
                if(line.includes("Ground Level:")) {
                    const m = line.match(/Ground Level:\s+([\d.]+)/);
                    if(m) gFt = parseFloat(m[1]); //
                }
                const p = line.trim().split(/\s+/);
                if(p.length === 3 && !isNaN(p[0])) {
                    // AGL ft -> AMSL m
                    const amsl = Math.round((parseFloat(p[0]) + gFt) * 0.3048 / 10) * 10;
                    windProfile[amsl] = { spd: parseFloat(p[2])/3.6, hdg: parseFloat(p[1]), src: 'file' };
                    count++;
                }
            });
            groundM = gFt * 0.3048;
            current.alt = groundM;
            document.getElementById('wind-info').innerText = count + " Schichten. Ground: " + groundM.toFixed(0) + "m";
        };
        reader.readAsText(input.files[0]);
    }

    // --- ENGINE & PHYSIK ---
    function mainLoop() {
        if (sim.active) {
            // Vertikal
            if (sim.burn) current.vs += 0.06;
            if (sim.vent) current.vs -= 0.09;
            current.vs -= 0.015; // Abkühlung
            current.vs *= 0.985; // Widerstand
            current.alt += current.vs * 0.1;
            if (current.alt < groundM) { current.alt = groundM; current.vs = 0; }

            // Horizontal (Wind-Einfluss)[cite: 1]
            const layers = Object.keys(windProfile).map(Number);
            if (layers.length) {
                const cL = layers.reduce((p, c) => Math.abs(c-current.alt) < Math.abs(p-current.alt) ? c : p);
                current.spd = windProfile[cL].spd;
                current.hdg = windProfile[cL].hdg;
                
                const d = current.spd * 0.1;
                const r = current.hdg * Math.PI / 180;
                current.lat += (d * Math.cos(r)) / 111111;
                current.lon += (d * Math.sin(r)) / (111111 * Math.cos(current.lat * Math.PI/180));
            }
        }
        updateUI();
    }

    function updateUI() {
        const pos = [current.lat, current.lon];
        bMark.setLatLng(pos);
        document.getElementById('val-alt').innerText = current.alt.toFixed(0);
        document.getElementById('val-spd').innerText = (current.spd * 3.6).toFixed(1);
        document.getElementById('val-hdg').innerText = current.hdg.toFixed(0) + "°";
        
        // 5 Min Vektor
        const d5 = current.spd * 300;
        const r5 = current.hdg * Math.PI/180;
        const p5 = [current.lat + (d5*Math.cos(r5))/111111, current.lon + (d5*Math.sin(r5))/(111111*Math.cos(current.lat*Math.PI/180))];
        pLine.setLatLngs([pos, p5]);
        document.getElementById('val-5min').innerText = d5.toFixed(0) + "m";

        // Marker Drop Berechnung (Iterativ durch Schichten)
        let sLa = current.lat, sLo = current.lon, sAl = current.alt;
        const mSink = 6.5; 
        while(sAl > groundM) {
            const layers = Object.keys(windProfile).map(Number);
            const w = layers.length ? windProfile[layers.reduce((p, c) => Math.abs(c-sAl) < Math.abs(p-sAl) ? c : p)] : { spd: 0, hdg: 0 };
            const stepD = w.spd * 1.0;
            const stepR = w.hdg * Math.PI/180;
            sLa += (stepD * Math.cos(stepR))/111111;
            sLo += (stepD * Math.sin(stepR))/(111111*Math.cos(sLa*Math.PI/180));
            sAl -= mSink;
        }
        dMark.setLatLng([sLa, sLo]).addTo(map);

        if(target) {
            const d2d = map.distance(pos, target);
            const task = document.getElementById('task-type').value;
            if(task === 'PDG') {
                const tA = parseFloat(document.getElementById('target-alt').value);
                const d3d = Math.sqrt(Math.pow(d2d,2) + Math.pow(current.alt - tA, 2));
                document.getElementById('val-res').innerText = d3d.toFixed(0) + "m (3D)";
            } else {
                document.getElementById('val-res').innerText = d2d.toFixed(0) + "m";
            }
            const dDr = map.distance([sLa, sLo], target);
            document.getElementById('val-drop').innerText = dDr.toFixed(0) + "m";
            if(dDr < 50) { document.getElementById('drop-alert').style.display = 'block'; beep(); }
            else { document.getElementById('drop-alert').style.display = 'none'; }
        }
    }

    // --- HELPERS ---
    function startGPS() {
        navigator.geolocation.watchPosition(p => {
            if (sim.active) return;
            current.lat = p.coords.latitude; current.lon = p.coords.longitude;
            current.alt = p.coords.altitude || groundM;
            current.spd = p.coords.speed || 0; current.hdg = p.coords.heading || 0;
            
            if(current.spd > 0.5) {
                const l = Math.round(current.alt/10)*10;
                windProfile[l] = { spd: current.spd, hdg: current.hdg, src: 'live' };
            }
            track.push([current.lat, current.lon]);
            tLine.setLatLngs(track);
        }, null, { enableHighAccuracy: true });
    }

    function simInput(t, a) { sim[t] = a; }
    function toggleSimulator() {
        sim.active = !sim.active;
        document.getElementById('sim-toggle').innerText = "SIMULATOR: " + (sim.active ? "ON" : "OFF");
        document.getElementById('sim-ui').style.display = sim.active ? "flex" : "none";
        if(sim.active) track = [];
    }
    function togglePanel(id) { document.getElementById(id).classList.toggle('open'); }
    function centerMap() { map.flyTo([current.lat, current.lon], 15); }
    map.on('contextmenu', e => { target = e.latlng; L.marker(target).addTo(map); playBeep(440); });
    function logMarker() { L.marker(dMark.getLatLng(), { icon: L.divIcon({ html: '<b style="color:red; font-size:24px;">X</b>', className: '' }) }).addTo(map); playBeep(880); }
    function playBeep(f) { if(audio) { const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value=f; g.gain.value=0.1; o.start(); o.stop(audio.currentTime+0.2); }}
    function exportGPX() {
        let g = `<?xml version="1.0"?><gpx version="1.1" creator="TacticalNav"><trk><trkseg>`;
        track.forEach(p => g += `<trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`);
        g += `</trkseg></trk></gpx>`;
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([g])); a.download = "track.gpx"; a.click();
    }
</script>
</body>
</html>
