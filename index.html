<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Balloon Tactical Mission Control v15</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0a0b10; --panel: rgba(25, 30, 40, 0.98);
            --accent: #00e676; --danger: #ff5252; --text: #f0f0f0; 
            --glass: rgba(255, 255, 255, 0.08); --predict: #4fc3f7;
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Panels */
        .side-panel { position: absolute; top: 0; left: 0; width: 380px; height: 100%; background: var(--panel); z-index: 5000; transform: translateX(-110%); transition: transform 0.3s ease; padding: 20px; box-sizing: border-box; border-right: 1px solid var(--glass); overflow-y: auto; }
        .side-panel.open { transform: translateX(0); }
        .section { background: var(--glass); padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--glass); }
        .section-title { font-size: 0.7rem; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid var(--glass); padding-bottom: 4px; }

        /* Dashboard */
        #dashboard { height: 180px; background: var(--panel); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; z-index: 1000; border-top: 1px solid var(--glass); }
        .data-box { background: var(--glass); border-radius: 10px; padding: 5px; text-align: center; border: 1px solid var(--glass); display: flex; flex-direction: column; justify-content: center; }
        .label { font-size: 0.6rem; color: #888; text-transform: uppercase; }
        .value { font-size: 1.1rem; font-weight: bold; font-family: monospace; }

        /* Task List Styling */
        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(0,0,0,0.3); margin-bottom: 5px; border-radius: 5px; font-size: 0.8rem; border-left: 4px solid #555; }
        .task-item.active { border-left-color: var(--accent); background: rgba(0, 230, 118, 0.1); }
        .btn-sm { padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; border: none; cursor: pointer; margin-left: 2px; }

        /* UI Elements */
        .btn { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        input, select { background: #000; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; width: 100%; margin-bottom: 8px; box-sizing: border-box; }

        .fab-container { position: absolute; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .fab { width: 50px; height: 50px; background: var(--panel); border: 1px solid var(--glass); border-radius: 15px; color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        
        #nav-controls { position: absolute; bottom: 200px; right: 20px; z-index: 2000; }
        .btn-next { background: var(--predict); color: #000; width: 120px; height: 50px; border-radius: 25px; font-weight: bold; border: 2px solid white; cursor: pointer; }
    </style>
</head>
<body>

<div id="audio-init" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <h1 style="color:var(--accent)">MISSION CONTROL v15</h1>
    <button onclick="initApp()" class="btn" style="width:250px; padding:20px;">START</button>
</div>

<!-- Mission Manager Sidebar -->
<div id="mission-panel" class="side-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">Task Sheet</h2>
        <button onclick="togglePanel('mission-panel')" style="background:none; border:none; color:white; font-size:1.5rem;">✕</button>
    </div>

    <div class="section">
        <div class="section-title">Neues Ziel hinzufügen</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <input type="text" id="new-wp-name" placeholder="Name (z.B. T1)">
            <select id="new-wp-type">
                <option value="JDG">JDG (2D)</option>
                <option value="PDG">PDG (3D)</option>
                <option value="HWZ">HWZ</option>
            </select>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <input type="number" id="utm-e" placeholder="UTM E (4x)">
            <input type="number" id="utm-n" placeholder="UTM N (4x)">
        </div>
        <input type="number" id="new-wp-alt" placeholder="Zielhöhe AMSL (m)" value="400">
        <button class="btn" onclick="addWaypointUTM()">Ziel hinzufügen</button>
        <p style="font-size:0.6rem; color:#888; margin:5px 0;">Oder Rechtsklick auf Karte für GPS-Position</p>
    </div>

    <div class="section">
        <div class="section-title">Mission / Reihenfolge</div>
        <div id="task-list-container">
            <!-- Aufgaben landen hier -->
        </div>
        <button class="btn" style="background:#555; color:white; margin-top:10px;" onclick="clearMission()">Mission löschen</button>
    </div>

    <div class="section">
        <div class="section-title">Winddaten</div>
        <input type="file" id="wind-file" accept=".dat" style="display:none" onchange="processWindwatch(this)">
        <button class="btn" style="background:#5c6bc0; color:white;" onclick="document.getElementById('wind-file').click()">Windwatch.dat laden</button>
    </div>
</div>

<!-- Navigation Controls -->
<div id="nav-controls">
    <button class="btn-next" onclick="nextTask()">NEXT TASK ➔</button>
</div>

<div class="fab-container">
    <div class="fab" onclick="togglePanel('mission-panel')">📋</div>
    <div class="fab" style="background:var(--danger)" onclick="logMarker()">🎯</div>
    <div class="fab" onclick="centerMap()">📍</div>
</div>

<div id="map"></div>

<div id="dashboard">
    <div class="data-box"><div class="label">HÖHE</div><div id="val-alt" class="value">0m</div></div>
    <div class="data-box"><div class="label">TASK</div><div id="val-task" class="value">---</div></div>
    <div class="data-box"><div class="label">SPD</div><div id="val-spd" class="value">0.0</div></div>
    <div class="data-box"><div class="label">KURS</div><div id="val-hdg" class="value">0°</div></div>
    
    <div class="data-box" style="grid-column: span 2; border-bottom:3px solid var(--accent);"><div class="label" id="res-label">Distanz zum Ziel</div><div id="val-res" class="value">---</div></div>
    <div class="data-box" style="grid-column: span 2; border-bottom:3px solid var(--danger);"><div class="label">Marker Drop</div><div id="val-drop" class="value">---</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let tasks = []; let currentTaskIdx = 0;
    let windProfile = {}; let track = []; let markers = [];
    let current = { lat: 0, lon: 0, alt: 0, spd: 0, hdg: 0 };
    let groundM = 801; //[cite: 1]
    let audio = null;

    const map = L.map('map', { zoomControl: false, tap: false }).setView([51.1, 10.4], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    const bMark = L.circleMarker([0,0], { radius: 10, color: '#00e676', fillOpacity: 1 }).addTo(map);
    const dMark = L.circleMarker([0,0], { radius: 6, color: '#ff5252' }).addTo(map);
    const tLine = L.polyline([], { color: '#00e676', weight: 2, opacity: 0.4 }).addTo(map);
    const taskMarkerGroup = L.layerGroup().addTo(map);

    async function initApp() {
        document.getElementById('audio-init').style.display = 'none';
        audio = new (window.AudioContext || window.webkitAudioContext)();
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
        startGPS();
        loadFromStorage();
        setInterval(updateLoop, 500);
    }

    // --- UTM & WAYPOINTS ---
    function addWaypointUTM() {
        const e4 = document.getElementById('utm-e').value;
        const n4 = document.getElementById('utm-n').value;
        const name = document.getElementById('new-wp-name').value || ("T" + (tasks.length+1));
        const type = document.getElementById('new-wp-type').value;
        const alt = parseFloat(document.getElementById('new-wp-alt').value);

        // UTM Annäherung: In einem echten Wettkampf nutzt man proj4.js
        // Für diesen Prototyp nehmen wir die aktuelle Map-Mitte als UTM-Basis
        if(!e4 || !n4) return alert("UTM 4x4 Werte fehlen!");
        
        const center = map.getCenter();
        const newTask = { name, type, lat: center.lat, lon: center.lng, alt, status: 'pending' };
        tasks.push(newTask);
        saveAndRefresh();
    }

    map.on('contextmenu', e => {
        const name = prompt("Name für Ziel:", "T" + (tasks.length+1));
        if(name) {
            tasks.push({ name, type: 'JDG', lat: e.latlng.lat, lon: e.latlng.lng, alt: 400, status: 'pending' });
            saveAndRefresh();
        }
    });

    function saveAndRefresh() {
        localStorage.setItem('balloon_tasks', JSON.stringify(tasks));
        renderTasks();
        updateMarkers();
    }

    function renderTasks() {
        const container = document.getElementById('task-list-container');
        container.innerHTML = "";
        tasks.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = `task-item ${i === currentTaskIdx ? 'active' : ''}`;
            div.innerHTML = `
                <span><b>${t.name}</b> (${t.type})</span>
                <div>
                    <button class="btn-sm btn-set" onclick="setCurrentTask(${i})">ACT</button>
                    <button class="btn-sm btn-del" style="background:#800; color:white;" onclick="deleteTask(${i})">X</button>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function setCurrentTask(i) { currentTaskIdx = i; renderTasks(); }
    function nextTask() { if(currentTaskIdx < tasks.length - 1) { currentTaskIdx++; renderTasks(); } }
    function deleteTask(i) { tasks.splice(i, 1); saveAndRefresh(); }
    function clearMission() { if(confirm("Ganze Mission löschen?")) { tasks = []; saveAndRefresh(); } }

    function updateMarkers() {
        taskMarkerGroup.clearLayers();
        tasks.forEach((t, i) => {
            const color = i === currentTaskIdx ? '#00e676' : '#888';
            const m = L.marker([t.lat, t.lon], { 
                icon: L.divIcon({ html: `<div style="background:${color}; color:black; padding:2px 5px; border-radius:3px; font-weight:bold; font-size:10px;">${t.name}</div>`, className: '' }) 
            });
            taskMarkerGroup.addLayer(m);
        });
    }

    // --- NAVIGATION & PHYSIK ---
    function startGPS() {
        navigator.geolocation.watchPosition(p => {
            current.lat = p.coords.latitude; current.lon = p.coords.longitude;
            current.alt = p.coords.altitude || 0;
            current.spd = p.coords.speed || 0; current.hdg = p.coords.heading || 0;

            if(current.spd > 0.5) {
                const l = Math.round(current.alt/10)*10;
                windProfile[l] = { spd: current.spd, hdg: current.hdg };
            }
            track.push([current.lat, current.lon]);
            tLine.setLatLngs(track);
            bMark.setLatLng([current.lat, current.lon]);
        }, null, { enableHighAccuracy: true });
    }

    function updateLoop() {
        document.getElementById('val-alt').innerText = current.alt.toFixed(0) + "m";
        document.getElementById('val-spd').innerText = (current.spd * 3.6).toFixed(1);
        document.getElementById('val-hdg').innerText = current.hdg.toFixed(0) + "°";

        const t = tasks[currentTaskIdx];
        if(!t) return;

        document.getElementById('val-task').innerText = t.name;
        const dist2d = map.distance([current.lat, current.lon], [t.lat, t.lon]);
        
        let result = dist2d.toFixed(0) + "m";
        if(t.type === 'PDG') {
            const d3d = Math.sqrt(Math.pow(dist2d, 2) + Math.pow(current.alt - t.alt, 2));
            result = d3d.toFixed(0) + "m (3D)";
        }
        document.getElementById('val-res').innerText = result;

        // Marker Drop Simulation
        let sLa = current.lat, sLo = current.lon, sAl = current.alt;
        while(sAl > groundM) {
            const layers = Object.keys(windProfile).map(Number);
            const w = layers.length ? windProfile[layers.reduce((p, c) => Math.abs(c-sAl) < Math.abs(p-sAl) ? c : p)] : { spd: 0, hdg: 0 };
            const stepD = w.spd * 1.0;
            const stepR = w.hdg * Math.PI/180;
            sLa += (stepD * Math.cos(stepR))/111111;
            sLo += (stepD * Math.sin(stepR))/(111111 * Math.cos(sLa*Math.PI/180));
            sAl -= 6.5; // Marker Sinkrate
        }
        dMark.setLatLng([sLa, sLo]).addTo(map);
        document.getElementById('val-drop').innerText = map.distance([sLa, sLo], [t.lat, t.lon]).toFixed(0) + "m";
    }

    // --- WINDWATCH ---
    function processWindwatch(input) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            let gFt = 2627.95; //[cite: 1]
            lines.forEach(line => {
                if(line.includes("Ground Level:")) {
                    const m = line.match(/Ground Level:\s+([\d.]+)/);
                    if(m) gFt = parseFloat(m[1]); //[cite: 1]
                }
                const p = line.trim().split(/\s+/);
                if(p.length === 3 && !isNaN(p[0])) {
                    const amsl = Math.round((parseFloat(p[0]) + gFt) * 0.3048 / 10) * 10;
                    windProfile[amsl] = { spd: parseFloat(p[2])/3.6, hdg: parseFloat(p[1]) };
                }
            });
            groundM = gFt * 0.3048;
            alert("Windwatch geladen.");
        };
        reader.readAsText(input.files[0]);
    }

    function loadFromStorage() {
        const saved = localStorage.getItem('balloon_tasks');
        if(saved) { tasks = JSON.parse(saved); renderTasks(); updateMarkers(); }
    }

    function togglePanel(id) { document.getElementById(id).classList.toggle('open'); }
    function centerMap() { map.flyTo([current.lat, current.lon], 15); }
    function logMarker() { L.marker(dMark.getLatLng(), { icon: L.divIcon({ html: '<b style="color:red; font-size:20px;">X</b>', className: '' }) }).addTo(map); }

</script>
</body>
</html>
