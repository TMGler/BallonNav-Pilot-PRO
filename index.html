<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Balloon Tactical Pro v12 - Sim & Mission</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0a0b10; --card-bg: rgba(30, 35, 45, 0.95);
            --accent: #00e676; --danger: #ff5252; --text: #f0f0f0; --glass: rgba(255, 255, 255, 0.1);
            --sim: #ffeb3b;
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Panels */
        .side-panel { position: absolute; top: 0; left: 0; width: 340px; height: 100%; background: var(--card-bg); z-index: 5000; transform: translateX(-110%); transition: transform 0.3s ease; padding: 25px; box-sizing: border-box; border-right: 1px solid var(--glass); overflow-y: auto; }
        .side-panel.open { transform: translateX(0); }
        
        .section { background: var(--glass); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        .section-title { font-size: 0.8rem; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }

        /* Dashboard */
        #dashboard { height: 180px; background: var(--card-bg); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; z-index: 1000; border-top: 1px solid var(--glass); }
        .data-box { background: var(--glass); border-radius: 12px; padding: 5px; text-align: center; border: 1px solid var(--glass); display: flex; flex-direction: column; justify-content: center; }
        .label { font-size: 0.6rem; color: #888; }
        .value { font-size: 1.1rem; font-weight: bold; font-family: monospace; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
        .sim-btn { background: var(--sim); color: #000; }

        /* Sim Controls Overlay */
        #sim-controls { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); z-index: 2000; display: none; gap: 20px; }
        .ctrl-btn { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; color: white; font-weight: bold; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
        #btn-burn { background: #d32f2f; box-shadow: 0 0 20px #f44336; }
        #btn-vent { background: #1976d2; box-shadow: 0 0 20px #2196f3; }

        .fab-container { position: absolute; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 12px; }
        .fab { width: 50px; height: 50px; background: var(--card-bg); border: 1px solid var(--glass); border-radius: 15px; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="audio-init" style="position:fixed; inset:0; background:black; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <h1 style="color:var(--accent)">BALLOON MISSION PRO</h1>
    <button onclick="initApp()" class="btn" style="width:220px; font-size:1.2rem;">INITIALISIEREN</button>
</div>

<!-- Simulation Controls -->
<div id="sim-controls">
    <div id="btn-vent" class="ctrl-btn" onmousedown="simAction('vent', true)" onmouseup="simAction('vent', false)" ontouchstart="simAction('vent', true)" ontouchend="simAction('vent', false)">VENTIL<br>(SINKEN)</div>
    <div id="btn-burn" class="ctrl-btn" onmousedown="simAction('burn', true)" onmouseup="simAction('burn', false)" ontouchstart="simAction('burn', true)" ontouchend="simAction('burn', false)">HEIZEN<br>(STEIGEN)</div>
</div>

<!-- Mission Planner Sidebar -->
<div id="mission-panel" class="side-panel">
    <h2>Missions-Planer</h2>
    <div class="section">
        <div class="section-title">Briefing / Aufgaben</div>
        <input type="text" id="mission-name" placeholder="Missions-Name" style="width:100%; padding:8px; margin-bottom:10px;">
        <button class="btn" onclick="saveMission()">Mission Speichern</button>
        <button class="btn" style="background:#555; color:white; margin-top:5px;" onclick="loadMission()">Mission Laden</button>
    </div>
    <div class="section">
        <div class="section-title">Modus</div>
        <button id="toggle-sim" class="btn sim-btn" onclick="toggleSimMode()">SIMULATOR: OFF</button>
    </div>
    <div class="section">
        <div class="section-title">Windwatch Import</div>
        <input type="file" id="wind-file" accept=".dat" style="display:none" onchange="importWindwatch(this)">
        <button class="btn" style="background:#5c6bc0; color:white;" onclick="document.getElementById('wind-file').click()">Windwatch.dat laden</button>
    </div>
    <button class="btn" style="background:#444; color:white; margin-top:20px;" onclick="togglePanel('mission-panel')">Schließen</button>
</div>

<div class="fab-container">
    <div class="fab" onclick="togglePanel('mission-panel')">📋</div>
    <div class="fab" style="background:var(--danger)" onclick="logMarkerDrop()">🎯</div>
    <div class="fab" onclick="centerMap()">📍</div>
</div>

<div id="map"></div>

<div id="dashboard">
    <div class="data-box"><div class="label">HÖHE (m)</div><div id="alt" class="value">0</div></div>
    <div class="data-box"><div class="label">VS (m/s)</div><div id="vs" class="value">0.0</div></div>
    <div class="data-box"><div class="label">SPD (k/h)</div><div id="spd" class="value">0.0</div></div>
    <div class="data-box"><div class="label">KURS</div><div id="hdg" class="value">0°</div></div>
    <button class="btn" style="grid-column: span 4; background: var(--danger); color: white;" onclick="logMarkerDrop()">MARKER ABWURF</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let isSimMode = false;
    let simData = { alt: 801, lat: 51.1, lon: 10.4, vs: 0, spd: 0, hdg: 0, burn: false, vent: false };
    let windProfile = {}; let currentPos = null; let targetCoords = null;
    let trackHistory = []; let groundLevelM = 801; //

    const map = L.map('map', { zoomControl: false, tap: false }).setView([51.1, 10.4], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    const balloonMarker = L.circleMarker([0,0], { radius: 10, color: '#00e676', fillOpacity: 1 }).addTo(map);
    const trackLine = L.polyline([], { color: '#00e676', weight: 2, opacity: 0.5 }).addTo(map);

    function initApp() {
        document.getElementById('audio-init').style.display = 'none';
        startGPS();
        setInterval(simulationLoop, 100); // 10Hz Physik-Update
    }

    // --- WINDWATCH PARSER ---
    function importWindwatch(input) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            let gLevelFt = 2627.95; //
            lines.forEach(line => {
                if(line.includes("Ground Level:")) {
                    const m = line.match(/Ground Level:\s+([\d.]+)/);
                    if(m) gLevelFt = parseFloat(m[1]); //
                }
                const p = line.trim().split(/\s+/);
                if(p.length === 3 && !isNaN(p[0])) {
                    // AGL ft -> AMSL m conversion
                    const amslM = Math.round((parseFloat(p[0]) + gLevelFt) * 0.3048 / 10) * 10;
                    windProfile[amslM] = { speed: parseFloat(p[2])/3.6, bearing: parseFloat(p[1]) };
                }
            });
            groundLevelM = gLevelFt * 0.3048;
            simData.alt = groundLevelM;
            alert("Windwatch-Profil für Simulation bereit!");
        };
        reader.readAsText(input.files[0]);
    }

    // --- SIMULATOR PHYSIK ---
    function toggleSimMode() {
        isSimMode = !isSimMode;
        document.getElementById('toggle-sim').innerText = isSimMode ? "SIMULATOR: ON" : "SIMULATOR: OFF";
        document.getElementById('sim-controls').style.display = isSimMode ? "flex" : "none";
        if(isSimMode) {
            simData.lat = map.getCenter().lat;
            simData.lon = map.getCenter().lng;
            trackHistory = [];
        }
    }

    function simAction(type, active) {
        if(type === 'burn') simData.burn = active;
        if(type === 'vent') simData.vent = active;
    }

    function simulationLoop() {
        if(!isSimMode) return;

        // Vertikale Physik
        if(simData.burn) simData.vs += 0.05;
        if(simData.vent) simData.vs -= 0.08;
        simData.vs -= 0.01; // Natürliche Abkühlung / Schwerkraft
        simData.vs *= 0.98; // Luftwiderstand
        simData.alt += simData.vs * 0.1;

        if(simData.alt < groundLevelM) { simData.alt = groundLevelM; simData.vs = 0; }

        // Horizontale Physik basierend auf Windprofil[cite: 1]
        const layers = Object.keys(windProfile).map(Number);
        if(layers.length > 0) {
            const closest = layers.reduce((p, c) => Math.abs(c-simData.alt) < Math.abs(p-simData.alt) ? c : p);
            const wind = windProfile[closest];
            simData.spd = wind.speed;
            simData.hdg = wind.bearing;

            // Bewegung berechnen
            const dist = simData.spd * 0.1;
            const bRad = simData.hdg * Math.PI / 180;
            simData.lat += (dist * Math.cos(bRad)) / 111111;
            simData.lon += (dist * Math.sin(bRad)) / (111111 * Math.cos(simData.lat * Math.PI / 180));
        }

        updateUI(simData.lat, simData.lon, simData.alt, simData.spd, simData.hdg, simData.vs);
    }

    function updateUI(lat, lon, alt, spd, hdg, vs) {
        currentPos = L.latLng(lat, lon);
        document.getElementById('alt').innerText = alt.toFixed(0);
        document.getElementById('vs').innerText = vs.toFixed(1);
        document.getElementById('spd').innerText = (spd * 3.6).toFixed(1);
        document.getElementById('hdg').innerText = hdg.toFixed(0) + "°";

        balloonMarker.setLatLng(currentPos);
        trackHistory.push([lat, lon]);
        if(trackHistory.length > 500) trackHistory.shift();
        trackLine.setLatLngs(trackHistory);
    }

    // --- GPS LOGIK ---
    function startGPS() {
        navigator.geolocation.watchPosition(pos => {
            if(isSimMode) return;
            const { latitude, longitude, altitude, speed, heading } = pos.coords;
            updateUI(latitude, longitude, altitude || 0, speed || 0, heading || 0, 0);
        }, null, { enableHighAccuracy: true });
    }

    // --- MISSION SAVING ---
    function saveMission() {
        const name = document.getElementById('mission-name').value || "Default";
        const mission = { name, wind: windProfile, target: targetCoords };
        localStorage.setItem("mission_" + name, JSON.stringify(mission));
        alert("Mission '" + name + "' gespeichert!");
    }

    function loadMission() {
        const name = document.getElementById('mission-name').value;
        const data = localStorage.getItem("mission_" + name);
        if(data) {
            const mission = JSON.parse(data);
            windProfile = mission.wind;
            targetCoords = mission.target;
            if(targetCoords) L.marker(targetCoords).addTo(map);
            alert("Mission '" + name + "' geladen!");
        }
    }

    function togglePanel(id) { document.getElementById(id).classList.toggle('open'); }
    function centerMap() { if(currentPos) map.flyTo(currentPos, 15); }
    map.on('contextmenu', e => { targetCoords = e.latlng; L.marker(e.latlng).addTo(map); });
    function logMarkerDrop() { alert("Marker Drop registriert bei " + document.getElementById('alt').innerText + "m"); }
</script>
</body>
</html>
