<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Balloon Tactical Pro v7</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0a0b10; --card-bg: rgba(30, 35, 45, 0.95);
            --accent: #00e676; --danger: #ff5252; --text: #f0f0f0; --glass: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Dashboard */
        #dashboard { 
            height: 140px; background: var(--card-bg); display: grid; 
            grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; 
            z-index: 1000; border-top: 1px solid var(--glass);
        }
        .data-box { background: var(--glass); border-radius: 12px; padding: 8px; text-align: center; border: 1px solid var(--glass); display: flex; flex-direction: column; justify-content: center; }
        .label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .value { font-size: 1.2rem; font-weight: 700; font-family: 'Monaco', monospace; margin-top: 2px; }

        /* Sidebar & UI */
        #settings-panel { position: absolute; top: 0; left: 0; width: 320px; height: 100%; background: var(--card-bg); z-index: 5000; transform: translateX(-100%); transition: transform 0.3s ease; padding: 25px; box-sizing: border-box; border-right: 1px solid var(--glass); display: flex; flex-direction: column; gap: 20px; }
        #settings-panel.open { transform: translateX(0); }
        .section { background: var(--glass); padding: 15px; border-radius: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .fab-container { position: absolute; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 15px; }
        .fab { width: 55px; height: 55px; background: var(--card-bg); border: 1px solid var(--glass); border-radius: 18px; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        
        /* Wake Lock Status Indicator */
        #wake-status { position: absolute; top: 20px; left: 20px; z-index: 2000; background: var(--card-bg); padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; border: 1px solid var(--glass); display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    </style>
</head>
<body>

<div id="audio-init" style="position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <button onclick="initApp()" class="btn" style="padding: 20px 60px; font-size: 1.2rem;">MISSION STARTEN</button>
    <p style="color:#555; margin-top:20px; font-size:0.8rem;">Aktiviert GPS, Audio & Keep-Awake</p>
</div>

<div id="wake-status"><div id="wake-dot" class="dot"></div> SCREEN LOCK: <span id="wake-text">OFF</span></div>

<div id="settings-panel">
    <h2>Setup</h2>
    <div class="section">
        <div style="font-size:0.8rem; color:var(--accent)">UTM 4x4 Ziel</div>
        <input type="number" id="utm-4-e" placeholder="Easting (4 Digits)">
        <input type="number" id="utm-4-n" placeholder="Northing (4 Digits)">
        <button class="btn" onclick="setGoalFromUTM()">Setze Ziel</button>
    </div>
    <div class="section">
        <label class="label">Zielhöhe AMSL (m)</label>
        <input type="number" id="cfg-target-alt" value="400">
        <label class="label">Marker Sinkrate (m/s)</label>
        <input type="number" id="cfg-fallrate" value="6.5" step="0.1">
    </div>
    <button class="btn" style="background:#444; color:white;" onclick="toggleSettings()">Schließen</button>
</div>

<div class="fab-container">
    <div class="fab" onclick="toggleSettings()">⚙️</div>
    <div class="fab" style="background:var(--danger)" onclick="logMarkerDrop()">🎯</div>
    <div class="fab" onclick="centerMap()">📍</div>
</div>

<div id="map"></div>

<div id="dashboard">
    <div class="data-box"><div class="label">HÖHE</div><div id="alt" class="value">0m</div></div>
    <div class="data-box"><div class="label">KURS</div><div id="hdg" class="value">0°</div></div>
    <div class="data-box"><div class="label">ZIEL DIST</div><div id="dist" class="value">---</div></div>
    <div class="data-box"><div class="label">DROP DIST</div><div id="drop-dist" class="value">---</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let windProfile = {}; let currentPos = null; let targetCoords = null;
    let dropPos = null; let trackPoints = []; let audioCtx = null;
    let wakeLock = null;

    const map = L.map('map', { zoomControl: false, tap: false }).setView([51.1, 10.4], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    const balloonMarker = L.circleMarker([0,0], { radius: 8, color: '#00e676', fillOpacity: 1 }).addTo(map);
    const dropMarker = L.circleMarker([0,0], { radius: 6, color: '#ff5252' }).addTo(map);
    const trackLine = L.polyline([], { color: '#00e676', weight: 2, opacity: 0.5 }).addTo(map);

    // --- WAKE LOCK LOGIK ---
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                updateWakeUI(true);
                wakeLock.addEventListener('release', () => {
                    updateWakeUI(false);
                });
            }
        } catch (err) {
            console.error(`${err.name}, ${err.message}`);
            updateWakeUI(false);
        }
    }

    function updateWakeUI(isActive) {
        document.getElementById('wake-dot').className = isActive ? 'dot active' : 'dot';
        document.getElementById('wake-text').innerText = isActive ? 'ACTIVE' : 'OFF';
        document.getElementById('wake-text').style.color = isActive ? 'var(--accent)' : '#888';
    }

    // Wenn man die App wechselt und zurückkommt, WakeLock neu anfordern
    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    // --- INITIALISIERUNG ---
    function initApp() {
        document.getElementById('audio-init').style.display = 'none';
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        requestWakeLock(); // Screen wach halten
        startGPS();
    }

    // --- MAP INTERACTION ---
    map.on('contextmenu', e => setGoal(e.latlng));
    function setGoal(latlng) {
        targetCoords = latlng;
        L.marker(latlng).addTo(map);
        playBeep(600, 0.1);
    }

    // --- GPS & PHYSIK ---
    function startGPS() {
        navigator.geolocation.watchPosition(pos => {
            const { latitude, longitude, altitude, speed, heading } = pos.coords;
            currentPos = L.latLng(latitude, longitude);
            document.getElementById('alt').innerText = (altitude || 0).toFixed(0) + "m";
            document.getElementById('hdg').innerText = (heading || 0).toFixed(0) + "°";
            balloonMarker.setLatLng(currentPos);
            trackPoints.push([latitude, longitude]);
            trackLine.setLatLngs(trackPoints);

            if(speed > 0.4) {
                windProfile[Math.floor((altitude || 0)/10)*10] = { speed, bearing: heading || 0 };
            }
            updatePhysics(latitude, longitude, altitude || 0);
        }, null, { enableHighAccuracy: true });
    }

    function updatePhysics(lat, lon, alt) {
        if(alt < 5) return;
        let sLat = lat, sLon = lon, sAlt = alt;
        const fallRate = parseFloat(document.getElementById('cfg-fallrate').value);

        while(sAlt > 0) {
            const layers = Object.keys(windProfile).map(Number);
            const closest = layers.length ? layers.reduce((p, c) => Math.abs(c-sAlt) < Math.abs(p-sAlt) ? c : p) : null;
            const wind = closest ? windProfile[closest] : { speed: 0, bearing: 0 };
            
            sLat += (wind.speed * Math.cos(wind.bearing * Math.PI/180)) / 111111;
            sLon += (wind.speed * Math.sin(wind.bearing * Math.PI/180)) / (111111 * Math.cos(lat * Math.PI/180));
            sAlt -= fallRate;
        }
        dropPos = L.latLng(sLat, sLon);
        dropMarker.setLatLng(dropPos).addTo(map);

        if(targetCoords) {
            document.getElementById('dist').innerText = map.distance(currentPos, targetCoords).toFixed(0) + "m";
            const dDrop = map.distance(dropPos, targetCoords);
            document.getElementById('drop-dist').innerText = dDrop.toFixed(0) + "m";
            if(dDrop < 50) playBeep(800, 0.05);
        }
    }

    function logMarkerDrop() {
        if(!dropPos) return;
        L.marker(dropPos, {icon: L.divIcon({html:'<b style="color:red; font-size:20px;">X</b>'})}).addTo(map);
        playBeep(1200, 0.2);
    }

    function toggleSettings() { document.getElementById('settings-panel').classList.toggle('open'); }
    function centerMap() { if(currentPos) map.flyTo(currentPos, 15); }
    function playBeep(f, d) { if(audioCtx) { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=f; g.gain.value=0.1; o.start(); o.stop(audioCtx.currentTime+d); }}
</script>
</body>
</html>
