<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Balloon Comp Navigator Pro</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --danger-color: #ff5252;
        }

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #map { 
            flex-grow: 1; 
            width: 100%; 
            background: #222;
        }

        #dashboard { 
            height: 220px; 
            background: var(--panel-color); 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            padding: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            border-top: 2px solid #333;
        }

        .data-box { 
            background: #2a2a2a; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center;
            border-bottom: 3px solid #444;
        }

        .data-box.highlight { border-bottom-color: var(--accent-color); }
        .data-box.target { border-bottom-color: var(--danger-color); }

        .label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; margin-bottom: 5px; }
        .value { font-size: 1.4rem; font-weight: bold; font-family: monospace; }
        .unit { font-size: 0.8rem; color: #888; margin-left: 3px; }

        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            background: var(--panel-color);
            color: white;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active { background: var(--accent-color); }

        /* Wind Profiler Panel */
        #wind-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 260px;
            max-height: 50vh;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }

        .panel-header {
            background: #111;
            padding: 12px;
            font-weight: bold;
            border-bottom: 1px solid #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px 8px 0 0;
        }
        
        .close-btn {
            background: none; border: none; color: #aaa; font-size: 16px;
            width: auto; height: auto; padding: 0; box-shadow: none;
        }

        .wind-list {
            overflow-y: auto;
            padding: 5px;
            max-height: calc(50vh - 50px);
        }

        .wind-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #333;
            font-family: monospace;
            font-size: 14px;
        }
        
        .wind-row:last-child { border-bottom: none; }
        
        .wind-alt { color: var(--accent-color); font-weight: bold; width: 50px;}
        .wind-dir { display: flex; align-items: center; gap: 5px; width: 70px;}
        .wind-spd { text-align: right; width: 80px;}

        /* UTM Overlay simple styling */
        #utm-input {
            position: absolute;
            top: 70px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 5px;
            display: none;
            flex-direction: column;
            gap: 5px;
        }
        #utm-input input { width: 120px; padding: 5px; }
    </style>
</head>
<body>

<!-- Wind Profiler Panel -->
<div id="wind-panel">
    <div class="panel-header">
        <span>Windprofil</span>
        <button class="close-btn" onclick="toggleWindPanel()">✖</button>
    </div>
    <div class="wind-list" id="wind-data-list">
        <div style="padding: 10px; text-align: center; color: #888;">Noch keine Daten gesammelt...</div>
    </div>
</div>

<div id="utm-input">
    <input type="text" id="utm-val" placeholder="UTM (WIP)">
    <button onclick="toggleUtmField()" style="width:100%; height:30px; border-radius:4px; font-size:12px;">Schließen</button>
</div>

<div class="controls">
    <button onclick="toggleWindPanel()" title="Windprofil anzeigen">🌬️</button>
    <button onclick="toggleUtmField()" title="UTM Ziel eingeben">📍</button>
    <button onclick="clearTrack()" title="Track löschen">🗑️</button>
</div>

<div id="map"></div>

<div id="dashboard">
    <div class="data-box highlight">
        <div class="label">Höhe (GPS)</div>
        <div class="value"><span id="alt">0</span><span class="unit">m</span></div>
    </div>
    <div class="data-box">
        <div class="label">Speed</div>
        <div class="value"><span id="spd">0.0</span><span class="unit">km/h</span></div>
    </div>
    <div class="data-box">
        <div class="label">Kurs</div>
        <div class="value"><span id="hdg">0</span><span class="unit">°</span></div>
    </div>
    
    <div class="data-box target">
        <div class="label">Ziel Distanz</div>
        <div class="value"><span id="dist">---</span><span class="unit">m</span></div>
    </div>
    <div class="data-box target">
        <div class="label">Ziel Ablage</div>
        <div class="value"><span id="bearing-diff">---</span><span class="unit">°</span></div>
    </div>
    <div class="data-box highlight" style="background: #1b2e1b;">
        <div class="label">Marker Landepunkt</div>
        <div id="drop-status" style="font-size: 0.8rem; color: var(--accent-color);">Warte auf GPS...</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // --- KONFIGURATION ---
    const MARKER_FALL_RATE = 6.5; 
    const WIND_LAYER_STEP = 10;   
    
    // Für Testzwecke simulieren wir Dummy-Daten, falls kein GPS da ist:
    // let windProfile = { 150: {speed: 4.1, bearing: 90}, 160: {speed: 4.5, bearing: 95}, 170: {speed: 5.0, bearing: 110} };
    let windProfile = {};         
    
    let trackPoints = [];
    let targetCoords = null;
    let currentPos = null;

    // --- INITIALISIERUNG ---
    const map = L.map('map', {
        zoomControl: false,
        maxZoom: 19
    }).setView([51.1657, 10.4515], 6);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const balloonIcon = L.divIcon({
        className: 'custom-div-icon',
        html: "<div style='background-color: #00e676; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 5px #000;'></div>",
        iconSize: [14, 14],
        iconAnchor: [7, 7]
    });

    const balloonMarker = L.marker([0,0], {icon: balloonIcon}).addTo(map);
    const dropPointMarker = L.circleMarker([0,0], {color: '#ff5252', radius: 6, weight: 3, fillOpacity: 0.8}).addTo(map);
    const targetMarker = L.marker([0,0], {draggable: true}).addTo(map);
    const trackLine = L.polyline([], {color: '#00e676', weight: 3, opacity: 0.8}).addTo(map);
    const dropLine = L.polyline([], {color: '#ff5252', weight: 2, dashArray: '5, 10'}).addTo(map);

    // --- UI FUNKTIONEN ---
    map.on('contextmenu', (e) => setTarget(e.latlng));

    function setTarget(latlng) {
        targetCoords = latlng;
        targetMarker.setLatLng(latlng).addTo(map);
    }

    function toggleUtmField() {
        const f = document.getElementById('utm-input');
        f.style.display = f.style.display === 'flex' ? 'none' : 'flex';
    }

    function toggleWindPanel() {
        const p = document.getElementById('wind-panel');
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
        updateWindPanel(); // Sofort updaten wenn geöffnet
    }

    function clearTrack() {
        trackPoints = [];
        trackLine.setLatLngs([]);
    }

    // Rendert das Windprofil in die UI
    function updateWindPanel() {
        const listDiv = document.getElementById('wind-data-list');
        const layers = Object.keys(windProfile).map(Number).sort((a, b) => b - a); // Absteigend (Höchste oben)

        if (layers.length === 0) return; // Nichts zu tun, wenn keine Daten

        listDiv.innerHTML = ''; // Leeren

        layers.forEach(alt => {
            const data = windProfile[alt];
            const speedKmh = (data.speed * 3.6).toFixed(1);
            const bearing = data.bearing.toFixed(0);
            
            // Pfeil-Rotation: Ein Pfeil nach OBEN (↑) gedreht um das Bearing zeigt in die Bewegungsrichtung
            const arrowStyle = `transform: rotate(${bearing}deg); display: inline-block; font-weight: bold; font-size: 16px;`;

            const row = document.createElement('div');
            row.className = 'wind-row';
            row.innerHTML = `
                <span class="wind-alt">${alt}m</span>
                <span class="wind-dir"><span style="${arrowStyle}">↑</span> ${String(bearing).padStart(3, '0')}°</span>
                <span class="wind-spd">${speedKmh} km/h</span>
            `;
            listDiv.appendChild(row);
        });
    }

    // --- BERECHNUNGS FUNKTIONEN ---
    function movePoint(lat, lon, distanceMeter, bearingDeg) {
        const R = 6371000;
        const dist = distanceMeter / R;
        const brng = bearingDeg * Math.PI / 180;
        const lat1 = lat * Math.PI / 180;
        const lon1 = lon * Math.PI / 180;

        const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dist) + Math.cos(lat1) * Math.sin(dist) * Math.cos(brng));
        const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(dist) * Math.cos(lat1), Math.cos(dist) - Math.sin(lat1) * Math.sin(lat2));

        return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
    }

    function getWindAtAlt(alt) {
        const layers = Object.keys(windProfile).map(Number);
        if (layers.length === 0) return null;
        const closest = layers.reduce((prev, curr) => Math.abs(curr - alt) < Math.abs(prev - alt) ? curr : prev);
        return windProfile[closest];
    }

    function updateDropCalculation(lat, lon, alt) {
        if (alt < 2 || Object.keys(windProfile).length === 0) return;

        let simLat = lat;
        let simLon = lon;
        let simAlt = alt;
        const timeStep = 1.0; 

        while (simAlt > 0) {
            const wind = getWindAtAlt(simAlt);
            if (wind) {
                const [nextLat, nextLon] = movePoint(simLat, simLon, wind.speed * timeStep, wind.bearing);
                simLat = nextLat;
                simLon = nextLon;
            }
            simAlt -= (MARKER_FALL_RATE * timeStep);
        }

        const dropPos = [simLat, simLon];
        dropPointMarker.setLatLng(dropPos);
        dropLine.setLatLngs([[lat, lon], dropPos]);
        
        document.getElementById('drop-status').innerText = "Aktiv";
    }

    // --- GPS CALLBACK ---
    function onLocationUpdate(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const alt = pos.coords.altitude || 0;
        const speed = pos.coords.speed || 0; 
        const heading = pos.coords.heading || 0;

        currentPos = [lat, lon];
        
        document.getElementById('alt').innerText = alt.toFixed(0);
        document.getElementById('spd').innerText = (speed * 3.6).toFixed(1);
        document.getElementById('hdg').innerText = heading.toFixed(0);

        // Wind aufzeichnen (Nur wenn der Ballon fährt, z.B. > 1 km/h)
        if (speed > 0.2) {
            const roundedAlt = Math.floor(alt / WIND_LAYER_STEP) * WIND_LAYER_STEP;
            // Daten im Profil speichern/aktualisieren
            windProfile[roundedAlt] = { speed: speed, bearing: heading };
            
            // Wenn das Wind-Panel gerade offen ist, sofort visuell updaten
            if (document.getElementById('wind-panel').style.display === 'flex') {
                updateWindPanel();
            }
        }

        balloonMarker.setLatLng(currentPos);
        trackPoints.push(currentPos);
        if (trackPoints.length > 500) trackPoints.shift();
        trackLine.setLatLngs(trackPoints);

        updateDropCalculation(lat, lon, alt);

        if (targetCoords) {
            const d = map.distance(currentPos, targetCoords);
            document.getElementById('dist').innerText = d.toFixed(0);
            
            const angle = (Math.atan2(targetCoords.lng - lon, targetCoords.lat - lat) * 180 / Math.PI + 360) % 360;
            const diff = (angle - heading + 540) % 360 - 180;
            document.getElementById('bearing-diff').innerText = (diff > 0 ? "R " : "L ") + Math.abs(diff).toFixed(0);
        }
    }

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(onLocationUpdate, 
            (err) => console.error("GPS Fehler:", err), 
            { enableHighAccuracy: true, maximumAge: 1000 }
        );
    } else {
        alert("GPS nicht verfügbar!");
    }

</script>
</body>
</html>
